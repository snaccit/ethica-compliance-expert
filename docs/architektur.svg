<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="600" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="30" y="40" font-size="18" font-weight="700" fill="#0f172a">Architektur Compliance Expert</text>
  <text x="30" y="60" font-size="12" fill="#64748b">Zwei Wege: Gesetze aufbereiten (links) und Fragen beantworten (rechts). Alles läuft lokal.</text>

  <!-- Spalte 1: Aufbereitung -->
  <text x="30" y="98" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">1 · AUFBEREITUNG (npm run ingest)</text>

  <rect x="30" y="110" width="190" height="64" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="125" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">EU-Amtsblatt</text>
  <text x="125" y="156" text-anchor="middle" font-size="11" fill="#475569">Cellar-API, Fallback EUR-Lex</text>

  <rect x="30" y="214" width="190" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="125" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Parser</text>
  <text x="125" y="260" text-anchor="middle" font-size="11" fill="#475569">Artikel, Absätze, Anhänge</text>

  <rect x="30" y="318" width="190" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="125" y="344" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Rechtseinheiten</text>
  <text x="125" y="364" text-anchor="middle" font-size="11" fill="#475569">812 Einheiten, feste IDs</text>

  <rect x="30" y="422" width="190" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="125" y="448" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">BM25-Index</text>
  <text x="125" y="468" text-anchor="middle" font-size="11" fill="#475569">MiniSearch, im Speicher</text>

  <line x1="125" y1="174" x2="125" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="125" y1="278" x2="125" y2="316" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="125" y1="382" x2="125" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="30" y="510" width="190" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="125" y="532" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Wissensgraph</text>
  <text x="125" y="549" text-anchor="middle" font-size="11" fill="#475569">Verweise zwischen Artikeln</text>
  <path d="M125,486 L125,508" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>

  <!-- Spalte 2: Frage -->
  <text x="270" y="98" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">2 · FRAGE BEANTWORTEN</text>

  <rect x="270" y="110" width="170" height="64" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="355" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Frage</text>
  <text x="355" y="156" text-anchor="middle" font-size="11" fill="#475569">Weboberfläche, Next.js</text>

  <rect x="270" y="214" width="170" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="355" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Agent</text>
  <text x="355" y="260" text-anchor="middle" font-size="11" fill="#1e40af">höchstens 5 Schritte</text>
  <text x="355" y="282" text-anchor="middle" font-size="11" fill="#334155">suche_rechtstext</text>
  <text x="355" y="298" text-anchor="middle" font-size="11" fill="#334155">lese_einheit</text>
  <text x="355" y="314" text-anchor="middle" font-size="11" fill="#334155">pruefe_zitat</text>
  <text x="355" y="330" text-anchor="middle" font-size="11" fill="#334155">antwort_geben</text>

  <rect x="270" y="384" width="170" height="64" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="355" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Zitatprüfung</text>
  <text x="355" y="430" text-anchor="middle" font-size="11" fill="#166534">Server, ohne Modell</text>

  <rect x="270" y="488" width="170" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="355" y="514" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Antwort</text>
  <text x="355" y="534" text-anchor="middle" font-size="11" fill="#475569">Status, Zitate, Sprunglink</text>

  <line x1="355" y1="174" x2="355" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="355" y1="344" x2="355" y2="382" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="355" y1="448" x2="355" y2="486" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Verbindung Agent <-> Index -->
  <path d="M270,279 L248,279 L248,454 L222,454" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="236" y="366" font-size="10" fill="#64748b" transform="rotate(-90 236 366)" text-anchor="middle">Suchen und Lesen</text>

  <!-- Spalte 3: Modell -->
  <text x="490" y="98" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">3 · SPRACHMODELL (lokal)</text>

  <rect x="490" y="214" width="200" height="130" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="590" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">LLM-Adapter</text>
  <text x="590" y="266" text-anchor="middle" font-size="11" fill="#334155">Ollama, Standard qwen2.5:7b</text>
  <text x="590" y="284" text-anchor="middle" font-size="11" fill="#334155">oder OpenAI-kompatibel</text>
  <text x="590" y="302" text-anchor="middle" font-size="11" fill="#334155">(z. B. LM Studio)</text>
  <text x="590" y="326" text-anchor="middle" font-size="11" fill="#9a3412">Tool Calling, JSON-Schema</text>

  <path d="M442,260 L488,260" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M488,300 L442,300" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="490" y="384" width="200" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="590" y="410" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Ohne Modell</text>
  <text x="590" y="430" text-anchor="middle" font-size="11" fill="#475569">nur Suchtreffer (Suchmodus)</text>
  <path d="M590,344 L590,382" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

  <!-- Spalte 4: Ergebnis-Status -->
  <text x="740" y="98" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">4 · ERGEBNIS</text>

  <rect x="740" y="110" width="190" height="442" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="835" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Status je Antwort</text>

  <rect x="756" y="154" width="158" height="52" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="835" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">belegt</text>
  <text x="835" y="194" text-anchor="middle" font-size="10" fill="#166534">alle Zitate im Gesetz gefunden</text>

  <rect x="756" y="218" width="158" height="52" rx="6" fill="#fef9c3" stroke="#fde047"/>
  <text x="835" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">teilweise belegt</text>
  <text x="835" y="258" text-anchor="middle" font-size="10" fill="#854d0e">ein Teil der Zitate fehlt</text>

  <rect x="756" y="282" width="158" height="52" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="835" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">nicht belegt</text>
  <text x="835" y="322" text-anchor="middle" font-size="10" fill="#991b1b">kein Zitat passt zum Text</text>

  <rect x="756" y="346" width="158" height="52" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="835" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">keine Quelle</text>
  <text x="835" y="386" text-anchor="middle" font-size="10" fill="#075985">Gesetz regelt es nicht</text>

  <rect x="756" y="410" width="158" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="835" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">nur Suche</text>
  <text x="835" y="450" text-anchor="middle" font-size="10" fill="#475569">kein Modell erreichbar</text>

  <text x="835" y="494" text-anchor="middle" font-size="10" fill="#64748b">Jedes Zitat führt per Link</text>
  <text x="835" y="508" text-anchor="middle" font-size="10" fill="#64748b">an die Stelle im EUR-Lex-Text.</text>

  <path d="M442,516 L738,516" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="0"/>
</svg>
